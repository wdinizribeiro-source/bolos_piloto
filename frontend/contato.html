    <title>Contato encomenda de Bolos</title>
    <style>

    <body>

        <div class="support-container">
            <h2>Fale conosco ou encomende Seu bolo Tematico</h2>
            <form id="supportForm">
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" required>

                <label for="telefone">Telefone:</label>
                <input type="number" id="telefone" name="telefone" required>

                <label for="message">Mensagem:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Enviar</button>
                <p id="feedback"></p>
            </form>
        </div>

        <script>
            document.getElementById("supportForm").addEventListener("submit", function (event) {
                event.preventDefault(); // Evita recarregar a página

                const name = document.getElementById("name").value.trim();
                const telefone = document.getElementById("telefone").value.trim();

                const message = document.getElementById("message").value.trim();
                const feedback = document.getElementById("feedback");

                // Validação simples
                if (!name || !telefone || !message) {
                    feedback.textContent = "Por favor, preencha todos os campos.";
                    feedback.className = "error";
                    return;
                }

                // Aqui você pode enviar os dados para um servidor via fetch/AJAX
                // Exemplo fictício:
                feedback.textContent = "Mensagem enviada com sucesso! Nossa equipe entrará em contato.";
                feedback.className = "success";

                // Limpar formulário
                document.getElementById("supportForm").reset();
            });
        </script>
